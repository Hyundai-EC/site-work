  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  

import { 
  getFirestore, 
  collection, 
  addDoc, 
  serverTimestamp,
  doc,
  onSnapshot,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyA4ifZEP4N_Ch9e0r_4hwvXNZgXFwbFM1c",
      authDomain: "ppaenjji-ac949.firebaseapp.com",
      projectId: "ppaenjji-ac949",
      storageBucket: "ppaenjji-ac949.firebasestorage.app",
      messagingSenderId: "1092159188617",
      appId: "1:1092159188617:web:5cf3e69df069d4a8c32058"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

// 오늘 날짜를 DD/MM/YYYY 형식으로 가져오기
function getTodayDateText() {
  return new Date().toLocaleDateString("en-GB");
}


// 중복 경고음
function playDuplicateAlarm() {
  try {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    const audioContext = new AudioContextClass();
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();

    oscillator.type = "square";
    oscillator.frequency.setValueAtTime(
      1000,
      audioContext.currentTime
    );

    gainNode.gain.setValueAtTime(
      0.18,
      audioContext.currentTime
    );

    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);

    oscillator.start();

    setTimeout(() => {
      oscillator.stop();
      audioContext.close();
    }, 600);

  } catch (error) {
    console.log("Alarm sound unavailable:", error);
  }
}


// 오늘 등록된 W-ID 중복 검사
async function checkTodayDuplicateWid(wid) {

  const cleanWid = String(wid || "").trim();

  if (!cleanWid) {
    return null;
  }

  const todayDateText = getTodayDateText();

  const todayQuery = query(
    collection(db, "workData"),
    where("dateText", "==", todayDateText)
  );

  const snapshot = await getDocs(todayQuery);

  for (const documentSnapshot of snapshot.docs) {

    const data = documentSnapshot.data();

    const registeredWids = Array.isArray(data.wids)
      ? data.wids.map(id => String(id).trim())
      : [];

    if (registeredWids.includes(cleanWid)) {
      return {
        wid: cleanWid,
        foremanName: data.foremanName || "Unknown",
        idCode: data.idCode || "-",
        plot: data.plot || "-",
        area: data.area || "-",
        location: data.location || "-"
      };
    }
  }

  return null;
}


// 중복 경고 표시
function showDuplicateWarning(duplicate) {

  playDuplicateAlarm();

  alert(
    "DUPLICATED W-ID\n\n" +
    "W-ID: " + duplicate.wid + "\n\n" +
    "Already used today by:\n" +
    "Foreman: " + duplicate.foremanName + "\n" +
    "ID Code: " + duplicate.idCode + "\n" +
    "Plot: " + duplicate.plot + "\n" +
    "Area: " + duplicate.area + "\n" +
    "Location: " + duplicate.location + "\n\n" +
    "Please use another W-ID."
  );
}



window.addEventListener("DOMContentLoaded", () => {
  const noticeBox = document.getElementById("noticeBox");

  onSnapshot(doc(db, "config", "notice"), (docSnap) => {
    if (docSnap.exists) {   // ✅ 여기 수정
noticeBox.innerHTML = `📢 ${docSnap.data().message}`;
    } else {
      noticeBox.textContent = "Notice..";
    }
  });
});

       

document.getElementById("foremanName").value =
  localStorage.getItem("foremanName") || "";
 

document.getElementById("idCode").value =
  localStorage.getItem("idCode") || "";


   window.sendData = async function () {

  const btn = document.getElementById("submitBtn");

  btn.disabled = true;
  btn.textContent = "Submitting...";


const foremanName = document.getElementById("foremanName").value.trim();

const idCode =
document.getElementById("idCode").value.trim();

if (!foremanName || !idCode) {

  alert("Please enter Foreman Name and ID Code");

  btn.disabled = false;
  btn.textContent = "Submit";

  return;
}



  try {

    // ✅ 버튼에서 선택된 값 가져오기
    let selectedAreas = Array.from(document.querySelectorAll(".area-btn.active"))
      .map(btn => btn.dataset.value);

if (selectedAreas.length === 0) {
  alert("Please select Work Area");
  btn.disabled = false;
  btn.textContent = "Submit";
  return;
}

    // ✅ All 선택 처리
    if (selectedAreas.includes("All")) {
      selectedAreas = ["All"];
    }

const wids = Array.from(
  document.querySelectorAll(".wid-input")
).map(input => input.value.trim());

const people =
Number(document.getElementById("people").value || 0);

if (
  wids.length !== people ||
  wids.some(id => id === "")
) {

  alert("Please fill all W-ID fields");

  btn.disabled = false;
  btn.textContent = "Submit";

  return;
}

// 현재 입력화면 내부의 중복 검사
const uniqueWids = new Set(wids);

if (uniqueWids.size !== wids.length) {

  playDuplicateAlarm();

  alert(
    "DUPLICATED W-ID\n\n" +
    "The same W-ID is entered more than once.\n" +
    "Please check all W-ID fields."
  );

  btn.disabled = false;
  btn.textContent = "Submit";
  return;
}


// 저장 직전 오늘 등록된 W-ID 재검사
for (const wid of wids) {

  const duplicate = await checkTodayDuplicateWid(wid);

  if (duplicate) {

    const matchingInput = Array.from(
      document.querySelectorAll(".wid-input")
    ).find(input => input.value.trim() === wid);

    if (matchingInput) {
      matchingInput.style.border = "3px solid red";
      matchingInput.style.backgroundColor = "#ffe5e5";
      matchingInput.dataset.duplicate = "true";
    }

    showDuplicateWarning(duplicate);

    btn.disabled = false;
    btn.textContent = "Submit";
    return;
  }
}


const selectedPlot =
  document.querySelector(".plot-btn.active");

if (!selectedPlot) {

  alert("Please select Plot");

  btn.disabled = false;
  btn.textContent = "Submit";

  return;
}



await addDoc(collection(db, "workData"), {

  foremanName: document.getElementById("foremanName").value,

idCode: document.getElementById("idCode").value,

plot: selectedPlot.dataset.value,



  area: selectedAreas.join(", "),
  workType: document.getElementById("workType").value,
  location: document.getElementById("location").value,

  
people: Number(document.getElementById("people").value || 0),
absent: Number(document.getElementById("absent").value || 0),


  description: document.getElementById("description").value,
 wids: wids,
  createdAt: serverTimestamp(),
  dateText: new Date().toLocaleDateString("en-GB"),
  timeText: new Date().toLocaleTimeString("en-GB")

});
localStorage.setItem("foremanName", document.getElementById("foremanName").value);
localStorage.setItem(
  "idCode",
  document.getElementById("idCode").value
);

    alert("Submitted successfully");

// ✅ 제출 후 초기화
document.querySelectorAll(".plot-btn")
  .forEach(btn => btn.classList.remove("active"));

const defaultPlot =
  document.querySelector('.plot-btn[data-value="PLOT-C"]');

if (defaultPlot) {
  defaultPlot.classList.add("active");
}
document.getElementById("location").value = "";

document.getElementById("people").value = "";
document.getElementById("absent").value = "";
document.getElementById("description").value = "";
document.getElementById("widContainer").innerHTML = "";


btn.disabled = false;
btn.textContent = "Submit";


  } catch (error) {
    console.error(error);
    alert("Submission failed: " + error.message);

    btn.disabled = false;
    btn.textContent = "Submit";
  }
};

// ✅ Plot 버튼 선택 기능
const plotButtons = document.querySelectorAll(".plot-btn");

plotButtons.forEach(btn => {
  btn.addEventListener("click", () => {

    // 기존 선택 해제
    plotButtons.forEach(b => b.classList.remove("active"));

    // 클릭한 Plot만 선택
    btn.classList.add("active");
  });
});

const areaButtons = document.querySelectorAll(".area-btn");
document.getElementById("people").addEventListener("input", () => {

  const count = Number(document.getElementById("people").value) || 0;

  const container = document.getElementById("widContainer");

  container.innerHTML = "";

  for (let i = 1; i <= count; i++) {

    container.innerHTML += `
      <div style="margin-bottom:8px;">
        <label>W-ID ${i}</label>
        <input type="text" class="wid-input">
      </div>
    `;

  }

});
// W-ID 입력 완료 시 당일 중복 검사
document
  .getElementById("widContainer")
  .addEventListener("change", async event => {

    if (!event.target.classList.contains("wid-input")) {
      return;
    }

    const input = event.target;
    const wid = input.value.trim();

    // 이전 경고상태 초기화
    input.style.border = "";
    input.style.backgroundColor = "";
    input.dataset.duplicate = "false";

    if (!wid) {
      return;
    }

    // 현재 입력화면 내부의 W-ID 중복 검사
    const currentInputs = Array.from(
      document.querySelectorAll(".wid-input")
    );

    const sameInputs = currentInputs.filter(item =>
      item.value.trim() === wid
    );

    if (sameInputs.length > 1) {

      playDuplicateAlarm();

      input.style.border = "3px solid red";
      input.style.backgroundColor = "#ffe5e5";
      input.dataset.duplicate = "true";

      alert(
        "DUPLICATED W-ID\n\n" +
        "W-ID: " + wid + "\n\n" +
        "This W-ID is entered more than once in the current form."
      );

      input.focus();
      input.select();
      return;
    }

    try {

      const duplicate = await checkTodayDuplicateWid(wid);

      if (duplicate) {

        input.style.border = "3px solid red";
        input.style.backgroundColor = "#ffe5e5";
        input.dataset.duplicate = "true";

        showDuplicateWarning(duplicate);

        input.focus();
        input.select();

      } else {

        input.style.border = "2px solid #28a745";
        input.style.backgroundColor = "#f0fff4";
        input.dataset.duplicate = "false";
      }

    } catch (error) {

      console.error("W-ID duplicate check failed:", error);

      alert(
        "W-ID duplicate check failed.\n" +
        "Please check the internet connection."
      );
    }
  });

areaButtons.forEach(btn => {
  btn.addEventListener("click", () => {


    const value = btn.dataset.value;

    if (value === "All") {
      // ✅ All만 선택
      areaButtons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    } else {
      // ✅ All 해제
      areaButtons.forEach(b => {
        if (b.dataset.value === "All") b.classList.remove("active");
      });

      // ✅ toggle (켜기/끄기)
      btn.classList.toggle("active");
    }
  });
});
window.sendKeyData = async function () {

  const btn = document.getElementById("keySubmitBtn");

  btn.disabled = true;
  btn.textContent = "Submitting...";

  const name = document.getElementById("keyName").value.trim() ||
  document.getElementById("foremanName").value.trim();
  const contact = document.getElementById("keyContact").value.trim();

  if (!name || !contact) {
    alert("Please enter Name and Contact");
    btn.disabled = false;
    btn.textContent = "Submit Key Borrow";
    return;
  }

  try {

 
await addDoc(collection(db, "masterKey"), {

  area: document.getElementById("keyArea").value,
plot: "PLOT-C",
  name: name,
  contact: contact,

  status: "Borrowed",
  createdAt: serverTimestamp()

});

    alert("Key Borrowed Successfully");

    // ✅ 초기화
    document.getElementById("keyName").value = "";
    document.getElementById("keyContact").value = "";

    btn.disabled = false;
    btn.textContent = "Submit Key Borrow";

  } catch (error) {
    console.error(error);
    alert("Error: " + error.message);

    btn.disabled = false;
    btn.textContent = "Submit Key Borrow";
  }
};

</script>
